[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-mm-v3"
version = "0.3.0"
description = "Qwen3.5 content-query video model with Wan2.1 rectified flow"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6,<2.9",
    "numpy>=1.26,<2",
    "safetensors>=0.5",
    "PyYAML>=6",
    "accelerate>=1.0",
    "transformers==5.19.0",
    "diffusers==0.41.0",
    "torchvision>=0.21,<0.24",
    "av>=14,<20",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.setuptools]
package-dir = {"" = "."}
py-modules = []

[tool.setuptools.packages.find]
include = ["ops*", "distributed*", "models*", "data*", "training*", "evaluations*", "utils*", "configs*", "scripts"]
namespaces = false

[tool.setuptools.package-data]
configs = ["*.yaml", "*.json", "tests/*.yaml", "evaluations/*.yaml"]
evaluations = ["scripts/*.sh", "benchmarks/vbench/*.json", "benchmarks/vbench/*.md", "benchmarks/vbench/LICENSE.vbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
extend-exclude = [".venv-npu", ".deps", ".python", ".cache", "outputs", "models/references"]

[tool.ruff.lint]
select = ["F821", "F822", "F823", "F811", "F601", "F602", "F631", "F632", "F633", "F634"]
