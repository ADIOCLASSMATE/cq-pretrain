# Set num_processes/num_machines/machine_rank to the actual cluster topology.
# Install the platform's compatible torch, torch_npu (Ascend) and DeepSpeed first.
compute_environment: LOCAL_MACHINE
distributed_type: DEEPSPEED
mixed_precision: bf16
num_machines: 1
num_processes: 16
machine_rank: 0
main_training_function: main
rdzv_backend: static
same_network: true
use_cpu: false
deepspeed_config:
  zero_stage: 2
  offload_optimizer_device: none
  offload_param_device: none
  zero3_init_flag: false
  deepspeed_multinode_launcher: standard
