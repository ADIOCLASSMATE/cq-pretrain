# Exact 81-frame OpenVid extraction; supply --in-place --manifest samples.jsonl.
# Training infers these video settings from the profile referenced by samples.jsonl.
data:
  representations: {qwen: cache, wan: cache}
  video:
    mode: native
    expected_num_frames: 81
    num_frames: null
    fps: null
    height: null
    width: null
    qwen_num_frames: null
    qwen_processor:
      do_resize: false
      fps: 2.0
      min_frames: 4
      max_frames: 16
      # For a fixed count, set qwen_num_frames above and set fps here to null.
